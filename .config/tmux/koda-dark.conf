# Koda (dark) status styling for tmux — https://github.com/oskarnurm/koda.nvim
# Colors only; content/formats live in ~/.tmux.conf

set -g status-style 'bg=#101010,fg=#b0b0b0'
set -g status-left-style 'bg=#458ee6,fg=#101010,bold'
set -g status-right-style 'fg=#50585d'

set -g window-status-style 'fg=#50585d'
set -g window-status-current-style 'fg=#458ee6,bold'

set -g pane-border-style 'fg=#272727'
set -g pane-active-border-style 'fg=#458ee6'

set -g message-style 'bg=#272727,fg=#b0b0b0'
set -g message-command-style 'bg=#272727,fg=#458ee6'
set -g mode-style 'bg=#272727,fg=#b0b0b0'
