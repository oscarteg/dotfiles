# Koda (light) status styling for tmux — https://github.com/oskarnurm/koda.nvim
# Colors only; content/formats live in ~/.tmux.conf

set -g status-style 'bg=#faf9f5,fg=#3d3d3d'
set -g status-left-style 'bg=#0253be,fg=#faf9f5,bold'
set -g status-right-style 'fg=#969ba5'

set -g window-status-style 'fg=#969ba5'
set -g window-status-current-style 'fg=#0253be,bold'

set -g pane-border-style 'fg=#ebebeb'
set -g pane-active-border-style 'fg=#0253be'

set -g message-style 'bg=#ebebeb,fg=#101010'
set -g message-command-style 'bg=#ebebeb,fg=#0253be'
set -g mode-style 'bg=#ebebeb,fg=#101010'
