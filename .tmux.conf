# Use Ctrl+A as the prefix key
set -g prefix C-a
unbind C-b
bind C-a send-prefix
set -g mouse on

# Use Vi mode
setw -g mode-keys vi

# Navigate with vim like bindings
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# open TMS in popup
bind C-o display-popup -E "tms"
bind C-i display-popup -E "tms switch"

# skip "kill-pane 1? (y/n)" prompt
bind-key x kill-pane 

# Toggle status bar
bind-key b set-option status

set -g detach-on-destroy off  # don't exit from tmux when closing a session

# Allow tmux to set the terminal title
set -g set-titles on
set-option -sg escape-time 10

# Start window and pane numbering from 1 for easier switching
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows automatically when a window is closed
set-option -g renumber-windows on

# Allow automatic renaming of windows
set -g allow-rename on

# Terminal type + truecolor passthrough (outer terminal is Ghostty).
# Set both -g and -s so tmux-sensible (loaded later via tpm) doesn't reset
# the server slot back to screen-256color.
set -g default-terminal "tmux-256color"
set -s default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-ghostty:Tc"
set -as terminal-features ",xterm-ghostty:RGB"
set -g allow-passthrough on

# Undercurls + colored underlines for nvim diagnostics/spell (Ghostty supports both)
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p2%{256}%/%d::%p3%d%;m'

# Koda status layout (content only — colors live in ~/.config/tmux/koda-*.conf)
set -g status-position top
set -g status-justify left

# Left side - session name (styled via status-left-style in the theme file)
set -g status-left-length 30
set -g status-left ' #S '

# Right side - mem/cpu monitor (tmux-mem-cpu-load) next to the clock.
# Colorless output inherits status-right-style from the Koda theme.
set -g status-interval 5
set -g status-right-length 80
set -g status-right '#(~/.tmux/plugins/tmux-mem-cpu-load/tmux-mem-cpu-load --interval 2 --graph-lines 10 --averages-count 0)  %I:%M %p '

# Window tabs
set -g window-status-format ' #I #W '
set -g window-status-current-format ' #I #W '
set -g window-status-separator '  '

# Koda theme: follow macOS appearance on load, re-sync on demand with prefix + T
run-shell '~/.config/tmux/koda-appearance.sh'
bind-key T run-shell '~/.config/tmux/koda-appearance.sh'

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'thewtex/tmux-mem-cpu-load'

# change the path for newly created windows
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -a -c "#{pane_current_path}"

# Autoinstall TPM
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

set -g @continuum-restore 'on'
